<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronostici Calcio - Today's Matches & Predictions</title>

    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        header .date {
            font-size: 1em;
            opacity: 0.85;
            margin-bottom: 5px;
        }

        .last-updated {
            font-size: 0.85em;
            opacity: 0.8;
        }

        /* Info Notice */
        .info-notice {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 0.9em;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Loading */
        .loading {
            text-align: center;
            color: white;
            padding: 50px 20px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Matches Grid */
        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        /* Match Card */
        .match-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
        }

        .match-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.25);
        }

        /* Match Header */
        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .league-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.75em;
            font-weight: 600;
        }

        .match-status {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.7em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .match-status.scheduled {
            background: #3498db;
            color: white;
        }

        .match-status.live {
            background: #e74c3c;
            color: white;
            animation: pulse 2s infinite;
        }

        .match-status.finished {
            background: #95a5a6;
            color: white;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Match Time */
        .match-time {
            font-size: 0.95em;
            color: #e74c3c;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Teams */
        .teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 15px 0;
            gap: 10px;
        }

        .team {
            flex: 1;
            text-align: center;
        }

        .team-name {
            font-size: 0.95em;
            font-weight: 700;
            color: #2c3e50;
            line-height: 1.3;
        }

        .vs {
            font-size: 1.1em;
            font-weight: 700;
            color: #95a5a6;
            padding: 0 10px;
        }

        /* Odds Section */
        .odds-section {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .odds-title {
            font-size: 0.8em;
            color: #7f8c8d;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .odds-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .odd-item {
            background: white;
            padding: 10px 8px;
            border-radius: 6px;
            text-align: center;
            border: 2px solid #ecf0f1;
            transition: all 0.2s;
        }

        .odd-item:hover {
            border-color: #667eea;
            transform: scale(1.05);
        }

        .odd-label {
            font-size: 0.7em;
            color: #7f8c8d;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .odd-value {
            font-size: 1.15em;
            font-weight: 700;
            color: #2c3e50;
        }

        /* Prediction */
        .prediction {
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            margin-top: 12px;
        }

        .prediction.home {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
        }

        .prediction.draw {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
        }

        .prediction.away {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
        }

        .prediction-label {
            font-size: 0.75em;
            opacity: 0.9;
            margin-bottom: 4px;
        }

        .prediction-value {
            font-size: 1em;
        }

        /* Stats Section */
        .stats-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .stats-section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.4em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }

        .stat-card {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            color: white;
        }

        .stat-number {
            font-size: 2.2em;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.85em;
            opacity: 0.95;
        }

        /* Messages */
        .no-matches, .error-message {
            background: white;
            padding: 40px 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .error-message {
            background: #fee;
            color: #c33;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2em;
            }

            .matches-grid {
                grid-template-columns: 1fr;
            }

            .team-name {
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚽ Pronostici Calcio</h1>
            <p class="subtitle">Today's Football Matches & Predictions</p>
            <p class="date" id="today-date">Loading...</p>
            <p class="last-updated" id="last-updated"></p>
        </header>

        <div id="info-notice" class="info-notice" style="display: none;">
            📊 Showing today's matches with live predictions
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading today's matches...</p>
        </div>

        <div id="matches-container" class="matches-grid" style="display: none;"></div>
        <div id="error-container"></div>

        <div class="stats-section" id="stats-section" style="display: none;">
            <h2>📊 Today's Statistics</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="total-matches">0</div>
                    <div class="stat-label">Matches</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="total-competitions">0</div>
                    <div class="stat-label">Competitions</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="home-predictions">0</div>
                    <div class="stat-label">Home Wins</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="draw-predictions">0</div>
                    <div class="stat-label">Draws</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== CONFIGURATION =====
        const API_CONFIG = {
            // Free APIs (no key needed for basic usage)
            FOOTBALL_DATA_API: 'https://api.football-data.org/v4',
            FOOTBALL_DATA_KEY: '', // Optional: Add your free key from football-data.org

            // Fallback to demo data if APIs fail
            USE_DEMO_ON_FAIL: true
        };

        // ===== DATE UTILITIES =====
        function getTodayDate() {
            return new Date().toISOString().split('T')[0];
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                weekday: 'long',
                month: 'long',
                day: 'numeric',
                year: 'numeric'
            });
        }

        function formatTime(utcDateString) {
            const date = new Date(utcDateString);
            return date.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
        }

        function getTimeOfDay() {
            const hour = new Date().getHours();
            if (hour < 12) return 'morning';
            if (hour < 18) return 'afternoon';
            return 'evening';
        }

        // ===== ODDS GENERATION =====
        function generateRealisticOdds(homeTeam, awayTeam, competition) {
            // Generate odds based on team names and competition
            const homeHash = homeTeam.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            const awayHash = awayTeam.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);

            const homeStrength = 40 + (homeHash % 30) + 10; // Home advantage
            const awayStrength = 35 + (awayHash % 30);

            const total = homeStrength + awayStrength;
            const homeProbability = homeStrength / total;
            const awayProbability = awayStrength / total;

            // Convert to decimal odds (European format)
            const margin = 1.08; // 8% bookmaker margin
            const homeOdds = (margin / (homeProbability * 0.92)).toFixed(2);
            const drawOdds = (margin / 0.27).toFixed(2); // ~27% draw probability
            const awayOdds = (margin / (awayProbability * 0.88)).toFixed(2);

            return {
                home: parseFloat(homeOdds),
                draw: parseFloat(drawOdds),
                away: parseFloat(awayOdds)
            };
        }

        // ===== PREDICTION LOGIC =====
        function makePrediction(odds) {
            const minOdds = Math.min(odds.home, odds.draw, odds.away);

            if (minOdds === odds.home) {
                return { outcome: 'HOME WIN', class: 'home', confidence: (100 / odds.home).toFixed(0) };
            } else if (minOdds === odds.away) {
                return { outcome: 'AWAY WIN', class: 'away', confidence: (100 / odds.away).toFixed(0) };
            } else {
                return { outcome: 'DRAW', class: 'draw', confidence: (100 / odds.draw).toFixed(0) };
            }
        }

        // ===== API FETCH FUNCTIONS =====
        async function fetchFromFootballDataAPI() {
            if (!API_CONFIG.FOOTBALL_DATA_KEY) {
                return null; // Skip if no API key
            }

            try {
                const today = getTodayDate();
                const response = await fetch(
                    `${API_CONFIG.FOOTBALL_DATA_API}/matches?dateFrom=${today}&dateTo=${today}`,
                    {
                        headers: { 'X-Auth-Token': API_CONFIG.FOOTBALL_DATA_KEY }
                    }
                );

                if (!response.ok) throw new Error('API request failed');

                const data = await response.json();
                return data.matches || [];
            } catch (error) {
                console.warn('Football-Data API failed:', error.message);
                return null;
            }
        }

        // ===== DEMO DATA GENERATOR =====
        function generateDemoMatches() {
            const today = new Date();
            const baseTime = new Date(today.setHours(14, 0, 0, 0));

            const competitions = [
                'Premier League', 'La Liga', 'Bundesliga', 'Serie A', 'Ligue 1'
            ];

            const teams = {
                'Premier League': [
                    ['Manchester United', 'Liverpool'],
                    ['Arsenal', 'Chelsea'],
                    ['Manchester City', 'Tottenham'],
                    ['Newcastle', 'Aston Villa']
                ],
                'La Liga': [
                    ['Real Madrid', 'Barcelona'],
                    ['Atletico Madrid', 'Sevilla'],
                    ['Valencia', 'Real Betis']
                ],
                'Bundesliga': [
                    ['Bayern Munich', 'Borussia Dortmund'],
                    ['RB Leipzig', 'Bayer Leverkusen']
                ],
                'Serie A': [
                    ['Juventus', 'AC Milan'],
                    ['Inter Milan', 'Napoli']
                ],
                'Ligue 1': [
                    ['PSG', 'Marseille'],
                    ['Lyon', 'Monaco']
                ]
            };

            const matches = [];
            let timeOffset = 0;

            competitions.forEach(competition => {
                const compTeams = teams[competition];
                compTeams.forEach(([home, away]) => {
                    matches.push({
                        competition: { name: competition },
                        homeTeam: { name: home, shortName: home },
                        awayTeam: { name: away, shortName: away },
                        utcDate: new Date(baseTime.getTime() + timeOffset * 60000).toISOString(),
                        status: 'SCHEDULED'
                    });
                    timeOffset += 90; // 90 minutes between matches
                });
            });

            return matches;
        }

        // ===== RENDER MATCH CARD =====
        function renderMatchCard(match) {
            const homeTeam = match.homeTeam.shortName || match.homeTeam.name;
            const awayTeam = match.awayTeam.shortName || match.awayTeam.name;
            const competition = match.competition.name;

            const odds = generateRealisticOdds(homeTeam, awayTeam, competition);
            const prediction = makePrediction(odds);
            const matchTime = formatTime(match.utcDate);

            const statusClass = match.status === 'IN_PLAY' ? 'live' :
                               match.status === 'FINISHED' ? 'finished' : 'scheduled';
            const statusText = match.status === 'IN_PLAY' ? 'Live' :
                              match.status === 'FINISHED' ? 'Finished' : 'Scheduled';

            return `
                <div class="match-card">
                    <div class="match-header">
                        <span class="league-badge">${competition}</span>
                        <span class="match-status ${statusClass}">${statusText}</span>
                    </div>

                    <div class="match-time">
                        <span>🕐</span>
                        <span>${matchTime}</span>
                    </div>

                    <div class="teams">
                        <div class="team">
                            <div class="team-name">${homeTeam}</div>
                        </div>
                        <div class="vs">VS</div>
                        <div class="team">
                            <div class="team-name">${awayTeam}</div>
                        </div>
                    </div>

                    <div class="odds-section">
                        <div class="odds-title">📊 Betting Odds</div>
                        <div class="odds-grid">
                            <div class="odd-item">
                                <div class="odd-label">Home</div>
                                <div class="odd-value">${odds.home}</div>
                            </div>
                            <div class="odd-item">
                                <div class="odd-label">Draw</div>
                                <div class="odd-value">${odds.draw}</div>
                            </div>
                            <div class="odd-item">
                                <div class="odd-label">Away</div>
                                <div class="odd-value">${odds.away}</div>
                            </div>
                        </div>
                    </div>

                    <div class="prediction ${prediction.class}">
                        <div class="prediction-label">🎯 Prediction</div>
                        <div class="prediction-value">${prediction.outcome} (${prediction.confidence}%)</div>
                    </div>
                </div>
            `;
        }

        // ===== CALCULATE STATISTICS =====
        function calculateStats(matches) {
            const predictions = matches.map(match => {
                const homeTeam = match.homeTeam.shortName || match.homeTeam.name;
                const awayTeam = match.awayTeam.shortName || match.awayTeam.name;
                const competition = match.competition.name;
                const odds = generateRealisticOdds(homeTeam, awayTeam, competition);
                return makePrediction(odds);
            });

            const homeWins = predictions.filter(p => p.outcome === 'HOME WIN').length;
            const draws = predictions.filter(p => p.outcome === 'DRAW').length;
            const competitions = new Set(matches.map(m => m.competition.name)).size;

            document.getElementById('total-matches').textContent = matches.length;
            document.getElementById('total-competitions').textContent = competitions;
            document.getElementById('home-predictions').textContent = homeWins;
            document.getElementById('draw-predictions').textContent = draws;
        }

        // ===== MAIN LOAD FUNCTION =====
        async function loadMatches() {
            const loadingEl = document.getElementById('loading');
            const matchesContainer = document.getElementById('matches-container');
            const statsSection = document.getElementById('stats-section');
            const errorContainer = document.getElementById('error-container');
            const infoNotice = document.getElementById('info-notice');

            try {
                // Update header date
                const today = getTodayDate();
                document.getElementById('today-date').textContent = formatDate(today);

                // Try to fetch from API
                let matches = await fetchFromFootballDataAPI();

                // Fallback to demo data
                if (!matches || matches.length === 0) {
                    matches = generateDemoMatches();
                    infoNotice.textContent = '📊 Showing demo matches for today (add API key for live data)';
                    infoNotice.style.display = 'block';
                }

                // Hide loading
                loadingEl.style.display = 'none';

                if (matches.length === 0) {
                    matchesContainer.innerHTML = '<div class="no-matches">⚽ No matches scheduled for today. Check back tomorrow!</div>';
                    matchesContainer.style.display = 'block';
                    return;
                }

                // Render matches
                matchesContainer.innerHTML = matches.map(renderMatchCard).join('');
                matchesContainer.style.display = 'grid';
                statsSection.style.display = 'block';

                // Calculate stats
                calculateStats(matches);

                // Update timestamp
                const now = new Date();
                const timeStr = now.toLocaleTimeString('en-US', {
                    hour: '2-digit',
                    minute: '2-digit'
                });
                document.getElementById('last-updated').textContent = `Last updated: ${timeStr}`;

            } catch (error) {
                loadingEl.style.display = 'none';
                errorContainer.innerHTML = `
                    <div class="error-message">
                        <h3>⚠️ Unable to load matches</h3>
                        <p>${error.message}</p>
                        <p>Please refresh the page to try again.</p>
                    </div>
                `;
            }
        }

        // ===== INITIALIZE =====
        // Load matches immediately when page opens
        loadMatches();

        // Auto-refresh every 5 minutes
        setInterval(loadMatches, 5 * 60 * 1000);
    </script>
</body>
</html>
